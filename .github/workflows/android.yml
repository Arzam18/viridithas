name: Build Viridithas for Android

on:
  workflow_dispatch:
    inputs:
      uci_date:
        description: "UCI version/date (e.g. 20260907)"
        required: true
        default: "20260907"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: viridithas-android-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set UCI Version
        shell: bash
        env:
          UCI_DATE: ${{ inputs.uci_date }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["UCI_DATE"]

          if not version.isdigit():
              raise SystemExit("uci_date must contain digits only, e.g. 20260918")

          if len(version) != 8:
              raise SystemExit("uci_date must be exactly 8 digits, e.g. 20260918")

          version_line = 'pub static VERSION: &str = env!("CARGO_PKG_VERSION");'
          version_replacement = f'pub static VERSION: &str = "{version}";'

          version_found = False
          for path in Path(".").rglob("*.rs"):
              if any(part in {".git", "target"} for part in path.parts):
                  continue

              text = path.read_text(encoding="utf-8")

              if version_line in text:
                  text = text.replace(version_line, version_replacement, 1)
                  path.write_text(text, encoding="utf-8")
                  print(f"Patched VERSION in {path}")
                  version_found = True
                  break

          if not version_found:
              raise SystemExit("Could not find Viridithas VERSION definition")

          # Remove the automatic Git-hash suffix from the UCI version.
          old_function = '''fn version() -> impl Display {
              let ext = if cfg!(feature = "final-release") {
                  String::new()
              } else {
                  format!("-{}", &GIT_HASH[..8.min(GIT_HASH.len())])
              };
              format!("{VERSION}{ext}")
          }'''

          new_function = '''fn version() -> impl Display {
              VERSION
          }'''

          function_found = False
          for path in Path(".").rglob("*.rs"):
              if any(part in {".git", "target"} for part in path.parts):
                  continue

              text = path.read_text(encoding="utf-8")

              if old_function in text:
                  text = text.replace(old_function, new_function, 1)
                  path.write_text(text, encoding="utf-8")
                  print(f"Patched version() in {path}")
                  function_found = True
                  break

          if not function_found:
              raise SystemExit("Could not find Viridithas version() function")
          PY

          echo "UCI version set to: $UCI_DATE"

      - name: Install Rust Toolchain & Android Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Configure Cargo for Android NDK Linker
        run: |
          mkdir -p .cargo
          cat << EOF > .cargo/config.toml
          [target.aarch64-linux-android]
          linker = "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"
          ar = "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          EOF

      - name: Fetch Evaluation Network
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url=$(curl -sSL --fail \
            ${GH_TOKEN:+-H "Authorization: Bearer $GH_TOKEN"} \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/cosmobobak/viridithas-networks/releases/latest" \
            | grep -o '"browser_download_url": "[^"]*' | awk -F'"' '{print $4}' | head -n1)
          echo "network url: $url"
          test -n "$url"
          curl -sSL --fail --retry 3 --retry-delay 5 "$url" -o viridithas.nnue.zst
          size=$(wc -c < viridithas.nnue.zst | tr -d '[:space:]')
          echo "downloaded $size bytes"
          test "$size" -gt 1000000

      - name: Build for Android ARM64
        shell: bash
        run: |
          cargo build --release --target aarch64-linux-android

      - name: Stage Artifact
        shell: bash
        run: |
          mkdir -p dist/bin
          cp target/aarch64-linux-android/release/viridithas dist/bin/viridithas-android-arm64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: viridithas-android-arm64
          path: dist/bin/viridithas-android-arm64
