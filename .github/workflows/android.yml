name: Release binaries

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Generic static aarch64 ---------------------------------------
          - artifact: viridithas-aarch64
            target: aarch64-unknown-linux-musl
            features: ""
            flags: ""
            bench: true
          - artifact: viridithas-aarch64-dotprod
            target: aarch64-unknown-linux-musl
            features: ""
            flags: "-C target-feature=+dotprod"
            bench: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU User Environment
        run: |
          sudo apt update && sudo apt install -y qemu-user

      - name: install rust target
        run: rustup target add ${{ matrix.target }}

      - name: install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: fetch network
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url=$(curl -sSL --fail \
            ${GH_TOKEN:+-H "Authorization: Bearer $GH_TOKEN"} \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/cosmobobak/viridithas-networks/releases/latest" \
            | grep -o '"browser_download_url": "[^"]*' | awk -F'"' '{print $4}' | head -n1)
          echo "network url: $url"
          test -n "$url"
          curl -sSL --fail --retry 3 --retry-delay 5 "$url" -o viridithas.nnue.zst
          size=$(wc -c < viridithas.nnue.zst | tr -d '[:space:]')
          echo "downloaded $size bytes"
          test "$size" -gt 1000000
          echo "EVALFILE=viridithas.nnue.zst" >> "$GITHUB_ENV"

      - name: build
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.flags }}
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo build --release --target ${{ matrix.target }} --features "${{ matrix.features }}"
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: bench via QEMU
        if: matrix.bench
        shell: bash
        run: |
          qemu-aarch64 "./target/${{ matrix.target }}/release/viridithas" bench

      - name: stage artifact
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/viridithas" "${{ matrix.artifact }}"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
