name: Build Viridithas for Android

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: viridithas-android-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain & Android Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android NDK & Clang Paths
        run: |
          echo "CC_aarch64_linux_android=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> $GITHUB_ENV
          echo "CARGO_LINKER=aarch64-linux-android28-clang" >> $GITHUB_ENV

      - name: Fetch Evaluation Network
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url=$(curl -sSL --fail \
            ${GH_TOKEN:+-H "Authorization: Bearer $GH_TOKEN"} \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/cosmobobak/viridithas-networks/releases/latest" \
            | grep -o '"browser_download_url": "[^"]*' | awk -F'"' '{print $4}' | head -n1)
          echo "network url: $url"
          test -n "$url"
          curl -sSL --fail --retry 3 --retry-delay 5 "$url" -o viridithas.nnue.zst
          size=$(wc -c < viridithas.nnue.zst | tr -d '[:space:]')
          echo "downloaded $size bytes"
          test "$size" -gt 1000000

      - name: Build for Android ARM64
        shell: bash
        run: |
          cargo build --release --target aarch64-linux-android

      - name: Stage Artifact
        shell: bash
        run: |
          mkdir -p dist/bin
          cp target/aarch64-linux-android/release/viridithas dist/bin/viridithas-android-arm64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: viridithas-android-arm64
          path: dist/bin/viridithas-android-arm64
